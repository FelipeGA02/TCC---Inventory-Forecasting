# Variáveis da API e do Job de treino no Cloud Run.
# Copie para deploy/env.cloudrun.yaml (não versionado — tem senhas) e preencha.
# Os valores são texto: mantenha as aspas.

# Banco: a mesma URL do Neon do ia-predictor/.env (região São Paulo, endpoint -pooler)
DATABASE_URL: ""

# Auth: os mesmos valores do ia-predictor/.env
JWT_SECRET_KEY: ""
JWT_ALGORITHM: "HS256"
ACCESS_TOKEN_EXPIRE_HOURS: "8"
REFRESH_TOKEN_EXPIRE_DAYS: "7"
ADMIN_EMAIL: "gestora@floricultura.com"
ADMIN_PASSWORD: ""
VIEWER_EMAIL: "gerente@floricultura.com"
VIEWER_PASSWORD: ""

# Endereço do front na Vercel (lista JSON). Na primeira publicação, deixe '[]'.
CORS_ORIGINS: '[]'

# O Cloud Run recusa requisição acima de 32 MB (uma planilha mensal tem ~8 MB)
MAX_UPLOAD_MB: "30"

# Treino (Job): um processo por CPU do Job (publicar.sh usa 4 CPUs)
TRAINING_WORKERS: "4"
RETRAIN_AFTER_UPLOAD_MINUTES: "10"

# TRAINING_RUNNER e CLOUD_RUN_JOB são preenchidos pelo publicar.sh
