openapi: 3.0.3

info:
  title: Floricultura — API de Previsão de Vendas
  description: |
    Sistema de previsão de demanda diária para rede de floricultura com 2 unidades
    operacionais (Jardim Canadá e Itabirito), horizonte de 14 a 91 dias escolhido na tela
    (padrão 14, ADR-021), com intervalo de confiança de 95%. Cada uma das 4 categorias e cada
    produto de grama, em cada loja, tem o seu SARIMAX (m = 7, D = 0; d = 0 ou 1 escolhido série a série
    pelo walk-forward — ADR-020; janela deslizante de
    545 dias — ADR-022, testado dia a dia em 8 semanas com h = 14); o total da loja é a soma das categorias (ADR-017). A previsão é treinada pelo
    admin (`POST /api/v1/servico-previsao/treinos`) depois de carregar as planilhas; não há
    treino agendado. O histórico da previsão guarda o previsto mais antigo de cada dia. A
    loja decide a compra; o sistema informa quanto deve vender (ADR-011).

    ## Autenticação
    Todos os endpoints `/api/v1/*` exigem JWT via header `Authorization: Bearer <token>`.
    Obtenha o token em `POST /auth/login`.

    ## Perfis
    - **admin**: envio de planilha e treino da previsão (`/api/v1/servico-previsao/*`), acesso completo
    - **viewer**: somente visualização (painel, histórico, análises, registros)

    ## Telas do frontend
    Cada tela pede só o que usa, quando é aberta. Logo após o login o front lê só
    `GET /api/v1/contexto` (leve); a Visão Geral lê `/api/v1/analises`, Previsão e
    Relatórios leem `/api/v1/painel`, o histórico da previsão lê
    `/api/v1/painel/historico/*` ao abrir cada item, e Conferir Dados consulta a base
    **paginada** em `/api/v1/registros/*`.

    ## 9.0.2
    Sem mudança de contrato. O histórico da previsão (`/api/v1/painel/historico/*`) guarda o
    registro mais antigo de cada dia (ADR-023): do walk-forward, a janela que previu o dia
    primeiro (`horizonte` até 14, não mais só 1); da previsão, os 14 primeiros dias de cada treino.
    Nenhum dia gravado é trocado por um treino seguinte.

    ## 9.0.1
    Sem mudança de contrato. A janela de treino passa de 365 para 545 dias (ADR-022): muda o valor de
    `janela_dias` na configuração do treino e do painel, e a descrição acima.

    ## 9.0.0
    Conferir Dados sem abas: saem o parâmetro `visao` de `/api/v1/registros/*` e o `por_visao` do
    resumo. Desconto e devolução viram os filtros `desconto` e `movimento`, combináveis com os outros.
    Novo `GET /api/v1/atividades`: o log de uso (planilhas enviadas e treinos) da tela Relatórios.

    ## 8.0.0
    O treino prevê `FORECAST_MAX_HORIZON_DAYS` (91) dias, e não mais 14 (ADR-021): a `previsao` do
    painel (loja e produto) traz todos eles, e a tela escolhe quantos mostrar (14 a 91, padrão 14).
    O teste de acerto (walk-forward) continua com h = 14. Novos campos:
    `configuracao.horizonte_previsao_dias` (painel e contexto) e, no serviço de previsão,
    `horizonte_previsao_dias` e `d_candidatos` (ADR-020: o treino roda o walk-forward com d = 0 e
    d = 1 em cada série e fica com o que errou menos; o d escolhido está na ordem de cada série). `previsao_14d` do produto continua a soma dos 14 primeiros dias (ordena a lista).
    Sai a classificação `low_confidence`: toda série que ajusta tem previsão e fica `trained`
    (`StatusSerie`, `MetricasModelo.status`); MASE e cobertura da faixa continuam nas métricas,
    sem classificar. No serviço de previsão sai `series_baixa_confianca` e `series_treinadas`
    passa a contar todas as séries com previsão.

    ## 7.0.0
    `GET /api/v1/painel/historico/*` devolve um objeto em vez da lista de dias: `serie` (a lista
    de antes) e `avaliacao`, as métricas do walk-forward da série no último treino concluído que
    a avaliou (erro médio por dia, erro em % da venda, MASE e largura da faixa de 95%) — a tela
    de histórico deixa de ler as métricas do painel.

    ## 6.0.0
    O fator das datas comemorativas (ADR-019) é interno: continua no previsto e na faixa, mas
    saem `ajustes_datas` da loja do painel, `fator` do dia previsto de produto e `ajuste` do
    dia do histórico da previsão. Saem também, de cada produto de grama do painel,
    `vendido_8_semanas`, `media_dia_aberto`, `pct_dias_abertos_com_venda` e
    `historico_semanal`; produto sem previsão fica ordenado por `vendido_total`.

    ## 5.1.0
    As datas comemorativas que mudaram a previsão (ADR-019) chegam à tela: `ajustes_datas` em
    cada loja do painel, `fator` em cada dia previsto de produto e `ajuste` em cada dia do
    histórico da previsão. Só campos novos.

    ## 5.0.0
    `limiar_encomenda_un` (2.000 un. fixo) virou `limiares_encomenda_un`, um por loja: média
    + 4 desvios-padrão da quantidade de todos os pedidos da loja, recalculado a cada planilha
    (ADR-018). No painel, é o do treino que gerou a previsão; no contexto, nas análises e nos
    registros, o atual.

    ## 4.0.0
    Saíram as rotas do treino anterior (`/api/v1/models/*`: modelo da loja, desagregação e
    produtos regulares), o teste de acerto por produto (`/painel/produtos/.../backtest`) e as
    rotas nunca implementadas (products, forecast, alerts, simulation, reports). O painel lê
    o último treino do serviço de previsão; o upload não agenda treino (`needs_training`).
  version: "9.0.2"
  contact:
    name: Daniel Nunes da Silva & Felipe Gurgel Araújo
    email: felipegurgel5@gmail.com

servers:
  - url: http://localhost:8000
    description: Desenvolvimento local

tags:
  - name: health
    description: Status do sistema
  - name: auth
    description: Autenticação e autorização
  - name: painel
    description: Dados das telas do frontend (previsão, histórico, análises, base linha a linha)
  - name: upload
    description: Envio das planilhas de vendas
  - name: servico-previsao
    description: |
      Treino da previsão (só admin; ADR-017): SARIMAX direto nas 4 categorias e em cada
      produto de grama, por loja (m=7, D=0; d de cada série pelo walk-forward, ADR-020), com walk-forward de janela
      deslizante e origem andando 1 dia, prevendo 14 dias; a previsão final cobre 91 dias (ADR-021). Roda em segundo plano; andamento, log e
      resultados ficam no banco, e o último treino concluído é o que o painel mostra.

# ─────────────────────────────────────────────
# Security Schemes
# ─────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtido via POST /auth/login

  # ─────────────────────────────────────────────
  # Schemas
  # ─────────────────────────────────────────────
  schemas:

    # --- Auth ---
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: gestora@floricultura.com
        password:
          type: string
          format: password
          example: "senha_segura_123"

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: bearer
        role:
          type: string
          enum: [admin, viewer]
          example: admin
        expires_in:
          type: integer
          description: Segundos até expiração do access_token
          example: 28800

    UserOut:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: gestora@floricultura.com
        name:
          type: string
          example: Ana Gestora
        role:
          type: string
          enum: [admin, viewer]
          example: admin

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    # --- Health ---
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: "1.0.0"
        database:
          type: string
          example: connected
        scheduler:
          type: string
          example: running

    # --- Upload ---
    UploadResponse:
      type: object
      properties:
        filename:
          type: string
          example: contas_jan2026.xlsx
        rows_added:
          type: integer
          example: 3821
        rows_skipped:
          type: integer
          example: 12
        rows_duplicate:
          type: integer
          example: 44
        processing_time_seconds:
          type: number
          format: float
          example: 8.3
        needs_training:
          type: boolean
          description: |
            A planilha trouxe venda nova: a previsão só passa a usá-la depois de "Treinar
            previsões" (`POST /api/v1/servico-previsao/treinos`). O treino não roda sozinho.
          example: true
        errors:
          type: array
          description: Avisos da carga (linhas ignoradas e dias que ficaram faltando, os mesmos da conferência)
          items:
            type: string

    UploadCheckResponse:
      type: object
      description: O que a carga da planilha faria, sem gravar nada (`POST /api/v1/upload/verificacao`)
      required: [filename, period_start, period_end, rows_new, rows_duplicate, rows_skipped, units,
                 missing_days, warnings]
      properties:
        filename: {type: string, example: semana 43.xlsx}
        period_start: {type: string, format: date, example: "2026-10-24"}
        period_end: {type: string, format: date, example: "2026-10-31"}
        rows_new: {type: integer, description: vendas que seriam gravadas, example: 2930}
        rows_duplicate: {type: integer, description: vendas que já estão na base, example: 0}
        rows_skipped: {type: integer, description: linhas ignoradas na leitura e na limpeza, example: 4}
        units:
          type: array
          items:
            type: object
            required: [unit_id, unit_name, first_day, last_day, rows, last_day_loaded]
            properties:
              unit_id: {type: string, example: itabirito}
              unit_name: {type: string, example: Itabirito}
              first_day: {type: string, format: date}
              last_day: {type: string, format: date}
              rows: {type: integer}
              last_day_loaded:
                type: string
                format: date
                nullable: true
                description: última venda da loja já na base, antes desta planilha
        missing_days:
          type: array
          description: |
            Lojas com dia de loja aberta (calendário da loja; fora dele, fechada só no domingo)
            que ficaria sem venda na base: entre a última venda já carregada e o 1º dia da
            planilha, dentro do período da planilha, ou a loja inteira se ela não está na
            planilha. Vazio quando não falta nada.
          items:
            type: object
            required: [unit_id, unit_name, days, ranges, message]
            properties:
              unit_id: {type: string, example: itabirito}
              unit_name: {type: string, example: Itabirito}
              days: {type: integer, description: dias de loja aberta sem venda, example: 3}
              ranges:
                type: array
                description: os dias, juntos quando entre eles só há dia de loja fechada
                items:
                  type: object
                  required: [start, end]
                  properties:
                    start: {type: string, format: date, example: "2026-10-21"}
                    end: {type: string, format: date, example: "2026-10-23"}
              message:
                type: string
                example: >-
                  Itabirito: faltam as vendas de 3 dias com a loja aberta (21/10/2026 a
                  23/10/2026). A última venda da loja já carregada é de 20/10/2026 e esta
                  planilha traz a loja de 24/10/2026 a 31/10/2026.
        warnings:
          type: array
          description: avisos da leitura (linhas de empresa ou categoria desconhecida ignoradas)
          items:
            type: string

    # --- Painel (telas do frontend) ---
    StatusSerie:
      type: string
      enum: [trained, insufficient_data, error]
      description: |
        `trained`: o modelo ajustou e a série tem previsão; `insufficient_data`: vendeu pouco para
        prever (sem previsão); `error`: o ajuste falhou neste treino (sem previsão).

    MetricasModelo:
      type: object
      description: |
        Teste de acerto do último treino (walk-forward, dias de loja aberta). Cada "rodada" é
        uma previsão de 14 dias, com a origem andando 1 dia. `ljung_box_p` e `shapiro_p` são
        dos resíduos do ajuste final (p ≤ 0,05 aponta o problema; não mudam o status).
      properties:
        rodadas: {type: integer}
        rodadas_vence_naive: {type: integer, nullable: true}
        dias_avaliados: {type: integer}
        mae: {type: number}
        mase: {type: number}
        erro_relativo_naive: {type: number, nullable: true, description: erro do modelo ÷ erro da naïve sazonal}
        cobertura_ic95_pct: {type: number}
        largura_ic95: {type: number}
        venda_media_dia: {type: number}
        previsto_sobre_real_pct: {type: number, nullable: true}
        erro_total_14d_pct: {type: number, nullable: true, description: erro no total de cada janela ÷ vendido}
        ljung_box_p: {type: number, nullable: true}
        shapiro_p: {type: number, nullable: true}

    ModeloSerie:
      type: object
      description: SARIMAX de uma categoria ou de um produto de grama numa loja; sem previsão, só status e motivo
      properties:
        ordem: {type: array, items: {type: integer}, nullable: true, example: [1, 0, 1]}
        ordem_sazonal: {type: array, items: {type: integer}, nullable: true, example: [0, 0, 1, 7]}
        aic: {type: number, nullable: true}
        status: {$ref: "#/components/schemas/StatusSerie"}
        metricas:
          allOf: [{$ref: "#/components/schemas/MetricasModelo"}]
          nullable: true
        mensagem: {type: string, nullable: true, description: por que ficou sem previsão}

    Faixa:
      type: object
      properties:
        previsto: {type: number}
        inf: {type: number, description: limite inferior da faixa de 95%}
        sup: {type: number, description: limite superior da faixa de 95%}

    UnidadePainel:
      type: object
      description: |
        Uma loja do painel (`UnidadeDados` em types.ts, fonte do detalhe). Além dos campos
        abaixo: período, linhas, volumes e SKUs por categoria, encomendas grandes, histórico
        diário (8 semanas) e semanal.
      additionalProperties: true
      properties:
        id: {type: string, example: jardim-canada}
        nome: {type: string}
        categorias_modelo:
          type: object
          description: O modelo de cada categoria (nulo se ela não entrou no treino)
          additionalProperties:
            allOf: [{$ref: "#/components/schemas/ModeloSerie"}]
            nullable: true
        previsao:
          type: array
          description: "Os dias previstos pelo treino (`configuracao.horizonte_previsao_dias`, 91) a partir do dia seguinte à última venda; previsto/inf/sup = soma das categorias. A tela mostra os primeiros 14 a 91 (ADR-021)"
          items:
            allOf:
              - $ref: "#/components/schemas/Faixa"
              - type: object
                properties:
                  data: {type: string, format: date}
                  dia_semana: {type: string}
                  loja_fechada: {type: boolean}
                  evento: {type: string, nullable: true}
                  categorias:
                    type: object
                    additionalProperties: {$ref: "#/components/schemas/Faixa"}
        produtos:
          type: array
          description: Produtos de grama do treino (com previsão primeiro)
          items:
            type: object
            additionalProperties: true
            properties:
              codigo: {type: string}
              nome: {type: string}
              modelo: {$ref: "#/components/schemas/ModeloSerie"}
              previsao:
                type: array
                description: vazia quando o produto ficou sem modelo
                items:
                  allOf:
                    - $ref: "#/components/schemas/Faixa"
                    - type: object
                      properties:
                        data: {type: string, format: date}
              previsao_14d: {type: number, nullable: true, description: "Soma dos 14 primeiros dias previstos (ordena a lista; a tela soma o horizonte escolhido)"}
        backtest_categorias:
          type: object
          description: Teste de acerto de cada categoria, dia a dia (o 1º dia de cada janela do walk-forward)
          additionalProperties:
            type: array
            items:
              allOf:
                - $ref: "#/components/schemas/Faixa"
                - type: object
                  properties:
                    data: {type: string, format: date}
                    real: {type: number}
                    naive: {type: number}

    Painel:
      description: |
        Formato `BaseReal` de `app-react/src/domain/types.ts`: previsão (até 91 dias) das 4
        categorias e dos produtos de grama de cada loja, com faixa de 95%, histórico,
        encomendas grandes, teste de acerto e planilhas carregadas. Montado de `sales` até o último
        dia com venda do último treino concluído e das tabelas do treino. Sem dados pessoais.
      type: object
      required: [gerado_em, base, configuracao, categorias, unidades, importacao]
      properties:
        gerado_em:
          type: string
          format: date-time
          description: quando o treino terminou
        fonte:
          type: string
        base:
          type: object
          properties:
            inicio: {type: string, format: date}
            fim: {type: string, format: date}
            linhas: {type: integer}
            skus: {type: integer}
            skus_por_categoria:
              type: object
              additionalProperties: {type: integer}
        configuracao:
          type: object
          description: O treino que gerou a previsão (`forecast_jobs.config`)
          properties:
            horizonte_dias: {type: integer, example: 14, description: Horizonte do teste de acerto (walk-forward), que dá o status}
            horizonte_previsao_dias: {type: integer, example: 91, description: "Dias previstos pelo treino; a tela escolhe de horizonte_dias até este (ADR-021)"}
            m: {type: integer, example: 7}
            d: {type: integer, example: 0, description: "Com um candidato só, o d de todas as séries; com mais, o primeiro"}
            d_candidatos: {type: array, items: {type: integer}, example: [0, 1], description: "d testados no walk-forward de cada série; o escolhido está em `ordem` (ADR-020)"}
            D: {type: integer, example: 0}
            alpha_ic: {type: number, example: 0.05}
            janela_dias: {type: integer, example: 545}
            origens: {type: integer, example: 56}
            passo_origem_dias: {type: integer, example: 1}
            limiares_encomenda_un: {type: object, additionalProperties: {type: number}, example: {jardim-canada: 1342.6, itabirito: 1959.7}, description: "Por loja: pedido acima disto é encomenda grande — média + 4 desvios-padrão da quantidade dos pedidos da loja (ADR-018)"}
            base: {type: string}
            categoria_produtos: {type: string, example: grama}
            versao_codigo: {type: string, nullable: true, description: commit do código que treinou}
            dados_ate: {type: string, format: date}
        categorias:
          type: array
          items:
            type: object
            properties:
              id: {type: string, example: grama}
              nome: {type: string}
              grupo: {type: string}
              descricao: {type: string}
        unidades:
          type: array
          items: {$ref: "#/components/schemas/UnidadePainel"}
        importacao:
          type: object
          description: Planilhas carregadas (`processing_log`, com o período de cada uma) e resumo da limpeza
          additionalProperties: true

    Analises:
      description: |
        Análises descritivas por loja (`AnalisesJson` em `app-react/src/app/data/analises.ts`):
        resumo, categorias, mês a mês, dia da semana, consumidor × cadastrado, formas de
        pagamento e produtos mais vendidos no último ano.
      type: object
      properties:
        gerado_em: {type: string, format: date-time}
        limiares_encomenda_un: {type: object, additionalProperties: {type: number}, example: {jardim-canada: 1342.6, itabirito: 1959.7}, description: "Por loja: pedido acima disto é encomenda grande — média + 4 desvios-padrão da quantidade dos pedidos da loja (ADR-018)"}
        unidades:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true

    Contexto:
      description: |
        O que o layout precisa logo após o login (`Contexto` em `app-react/src/domain/types.ts`),
        montado só com consultas agregadas — sem ler a base de vendas inteira.
      type: object
      properties:
        lojas:
          type: array
          items:
            type: object
            properties:
              id: {type: string, example: jardim-canada}
              nome: {type: string}
              cidade: {type: string}
        categorias:
          type: array
          items: {type: object, additionalProperties: true}
        configuracao:
          type: object
          properties:
            horizonte_dias: {type: integer, example: 14, description: Horizonte do teste de acerto (walk-forward)}
            horizonte_previsao_dias: {type: integer, example: 91, description: "Dias previstos pelo último treino; a tela escolhe de 14 até este (ADR-021)"}
            limiares_encomenda_un: {type: object, additionalProperties: {type: number}, example: {jardim-canada: 1342.6, itabirito: 1959.7}, description: "Por loja: pedido acima disto é encomenda grande — média + 4 desvios-padrão da quantidade dos pedidos da loja (ADR-018)"}
            treino_na_api:
              type: boolean
              description: Falso quando a API não treina (Render); o front não oferece "Treinar previsões"
        base:
          type: object
          properties:
            inicio: {type: string, format: date, nullable: true}
            fim: {type: string, format: date, nullable: true, description: Última venda carregada}
            linhas: {type: integer}
            skus: {type: integer}
        previsao:
          type: object
          nullable: true
          description: Último treino concluído; nulo antes do primeiro treino
          properties:
            gerada_em: {type: string, format: date-time}
            dados_ate: {type: string, format: date, description: último dia com venda usado no treino}
            categorias:
              type: array
              description: As 4 categorias de cada loja e o status da previsão de cada uma
              items:
                type: object
                properties:
                  loja: {type: string}
                  categoria: {type: string}
                  status: {$ref: "#/components/schemas/StatusSerie"}
            produtos:
              type: array
              description: Os produtos de grama do treino e o status de cada um
              items:
                type: object
                properties:
                  loja: {type: string}
                  codigo: {type: string}
                  nome: {type: string}
                  status: {$ref: "#/components/schemas/StatusSerie"}
        importacao:
          type: object
          additionalProperties: true

    IndiceRegistros:
      description: Meses com venda na base, quantas linhas cada um tem por loja, e as opções dos filtros (tela Conferir Dados).
      type: object
      properties:
        lojas:
          type: array
          items: {type: string}
        pagamentos:
          type: array
          description: "Formas de pagamento como a tela mostra (ex.: Pix); é o valor aceito no filtro `pagamentos`"
          items: {type: string}
        limiares_encomenda_un: {type: object, additionalProperties: {type: number}, description: "Limiar de encomenda grande atual de cada loja (ADR-018)"}
        total_registros: {type: integer}
        meses:
          type: array
          items:
            type: object
            properties:
              mes: {type: string, example: "2026-02"}
              registros: {type: integer}
              por_loja:
                type: object
                additionalProperties: {type: integer}

    Registro:
      description: Uma linha de produto de uma nota. Sem nome de cliente, vendedor ou operador.
      type: object
      properties:
        id: {type: integer}
        data: {type: string, format: date}
        loja: {type: string}
        nota: {type: string}
        cod: {type: string}
        nome: {type: string}
        cat: {type: string, description: id da categoria}
        qtd: {type: number}
        unit: {type: number}
        desc: {type: number}
        liq: {type: number}
        pag: {type: string}
        cad: {type: boolean, description: cliente cadastrado (× consumidor)}
        enc: {type: boolean, description: "encomenda grande: nota acima do limiar da loja quando foi gravada (ADR-018)"}

    PaginaRegistros:
      type: object
      properties:
        pagina: {type: integer}
        tamanho: {type: integer}
        linhas:
          type: array
          items:
            $ref: "#/components/schemas/Registro"

    Atividade:
      description: Uma planilha enviada (`tipo = planilha`) ou um treino da previsão (`tipo = treino`). Os campos do outro tipo vêm nulos.
      type: object
      required: [tipo, id, inicio, fim, situacao, usuario, origem, arquivo, periodo, linhas_novas, linhas_duplicadas, dados_ate, series_com_previsao, series_sem_dados, series_com_falha, mensagem]
      properties:
        tipo: {type: string, enum: [planilha, treino]}
        id: {type: integer}
        inicio: {type: string, format: date-time}
        fim: {type: string, format: date-time, nullable: true}
        situacao: {type: string, enum: [concluido, sem_dados_novos, em_andamento, erro]}
        usuario: {type: string, nullable: true, description: Nome de quem enviou ou treinou (nulo na carga inicial e no script)}
        origem: {type: string, enum: [envio, carga_inicial, botao, script]}
        arquivo: {type: string, nullable: true}
        periodo: {type: array, nullable: true, items: {type: string, format: date}, minItems: 2, maxItems: 2, description: Primeiro e último dia da planilha}
        linhas_novas: {type: integer, nullable: true}
        linhas_duplicadas: {type: integer, nullable: true}
        dados_ate: {type: string, format: date, nullable: true, description: Último dia com venda usado no treino}
        series_com_previsao: {type: integer, nullable: true}
        series_sem_dados: {type: integer, nullable: true}
        series_com_falha: {type: integer, nullable: true}
        mensagem: {type: string, nullable: true, description: O motivo do erro (só quando `situacao = erro`)}

    ResumoRegistros:
      description: Totais do filtro.
      type: object
      properties:
        registros: {type: integer}
        notas: {type: integer}
        quantidade: {type: number}
        desconto: {type: number}
        valor_liquido: {type: number}

    # --- Errors ---
    # --- Serviço de previsão ---
    ConfigServico:
      type: object
      description: Como o serviço treina (o modal de confirmação mostra isto).
      required: [m, d, d_candidatos, D, janela_dias, origens, passo_dias, horizonte_dias, horizonte_previsao_dias, base, categoria_produtos]
      properties:
        m: {type: integer, example: 7, description: Período sazonal (semanal)}
        d: {type: integer, example: 0, description: "Com um candidato só, o d de todas as séries; com mais, o primeiro"}
        d_candidatos: {type: array, items: {type: integer}, example: [0, 1], description: "d testados no walk-forward de cada série; fica o que errou menos (ADR-020)"}
        D: {type: integer, example: 0, description: Diferenciação sazonal (fixa em 0 — o ciclo entra pelas dummies)}
        janela_dias: {type: integer, example: 545, description: Janela deslizante de treino (ADR-022)}
        origens: {type: integer, example: 56, description: Origens do walk-forward}
        passo_dias: {type: integer, example: 1, description: A origem anda este número de dias}
        horizonte_dias: {type: integer, example: 14, description: Horizonte do walk-forward (o teste que dá o status)}
        horizonte_previsao_dias: {type: integer, example: 91, description: "Dias da previsão final (ADR-021)"}
        base: {type: string, example: "fluxo diário (sem encomendas grandes: pedido acima de média + 4 desvios-padrão da quantidade de todos os pedidos da loja, ADR-018)"}
        categoria_produtos: {type: string, example: grama, description: Categoria cujos produtos são treinados um a um}

    TreinoServico:
      type: object
      description: Um disparo do serviço de previsão (`forecast_jobs`).
      required: [id, status, criado_em]
      properties:
        id: {type: integer}
        status:
          type: string
          enum: [pending, running, done, error, skipped]
          description: "`skipped` = dados sem alteração desde o último treino concluído; nada treinado"
        criado_em: {type: string, format: date-time}
        iniciado_em: {type: string, format: date-time, nullable: true}
        concluido_em: {type: string, format: date-time, nullable: true}
        dados_ate: {type: string, format: date, nullable: true, description: Último dia com venda usado}
        total_series: {type: integer, description: "Séries com dados suficientes para treinar (as demais vêm em `series_dados_insuficientes`)"}
        series_concluidas: {type: integer, description: "Delas, quantas já terminaram — base de `progresso_pct`"}
        progresso_pct: {type: number, format: float}
        serie_atual: {type: string, nullable: true, example: "Itabirito · Grama"}
        series_treinadas: {type: integer, description: "Séries com previsão"}
        series_dados_insuficientes: {type: integer}
        series_com_erro: {type: integer}
        mensagem: {type: string, nullable: true}

    StatusServico:
      type: object
      required: [treino_na_api, config]
      properties:
        treino_na_api: {type: boolean, description: "Falso com `TRAINING_RUNNER=externo`: o botão não aparece"}
        em_andamento:
          allOf: [{$ref: "#/components/schemas/TreinoServico"}]
          nullable: true
        ultimo:
          allOf: [{$ref: "#/components/schemas/TreinoServico"}]
          nullable: true
        ultimo_concluido_em: {type: string, format: date-time, nullable: true}
        dados_alterados:
          type: boolean
          nullable: true
          description: Se um disparo agora treinaria. Nulo enquanto há treino em andamento.
        config:
          $ref: "#/components/schemas/ConfigServico"

    DisparoResposta:
      type: object
      required: [iniciado, mensagem, treino]
      properties:
        iniciado: {type: boolean, description: Falso quando os dados não mudaram (disparo registrado como `skipped`)}
        mensagem: {type: string}
        treino:
          $ref: "#/components/schemas/TreinoServico"

    LogTreino:
      type: object
      required: [id, registrado_em, nivel, mensagem]
      properties:
        id: {type: integer}
        registrado_em: {type: string, format: date-time}
        nivel: {type: string, enum: [info, warning, error]}
        serie: {type: string, nullable: true, example: "itabirito:category:grama"}
        mensagem: {type: string}

    PrevisaoDia:
      type: object
      required: [data, previsto, inf_95, sup_95]
      properties:
        data: {type: string, format: date}
        previsto: {type: number}
        inf_95: {type: number}
        sup_95: {type: number}

    SerieTreinada:
      type: object
      required: [id, loja, loja_nome, nivel, nome, status, previsao]
      properties:
        id: {type: integer}
        loja: {type: string, example: itabirito}
        loja_nome: {type: string, example: Itabirito}
        nivel: {type: string, enum: [category, product]}
        categoria: {type: string, nullable: true, example: grama}
        produto_codigo: {type: string, nullable: true}
        nome: {type: string, description: Nome da categoria ou do produto}
        status: {type: string, enum: [trained, insufficient_data, error]}
        ordem: {type: array, items: {type: integer}, nullable: true, example: [1, 0, 2]}
        ordem_sazonal: {type: array, items: {type: integer}, nullable: true, example: [0, 0, 1, 7]}
        aic: {type: number, nullable: true}
        mase: {type: number, nullable: true}
        cobertura_ic95_pct: {type: number, nullable: true}
        metricas:
          type: object
          nullable: true
          description: Walk-forward nos dias de loja aberta (origens, mae, rmse, mase, erro_relativo_naive, cobertura_ic95_pct, largura_ic95, ...)
        mensagem: {type: string, nullable: true, description: Motivo de `insufficient_data` ou `error`}
        previsao:
          type: array
          items: {$ref: "#/components/schemas/PrevisaoDia"}

    ErrorDetail:
      type: object
      properties:
        detail:
          type: string
          example: "Você não tem permissão para esta ação."

    DiaHistoricoPrevisao:
      type: object
      required: [data, real, previsto, inf, sup, fonte, horizonte, loja_fechada]
      properties:
        data: {type: string, format: date}
        real: {type: number, description: vendido no dia, sem encomendas grandes}
        previsto: {type: number, nullable: true}
        inf: {type: number, nullable: true, description: limite inferior da faixa de 95%}
        sup: {type: number, nullable: true, description: limite superior da faixa de 95%}
        fonte:
          type: string
          nullable: true
          enum: [forecast, walk_forward, null]
          description: |
            `forecast`: a previsão que a loja viu (a primeira que cobriu o dia); `walk_forward`:
            dia que nenhuma previsão cobriu, com a janela mais antiga do teste do treino que o previu
        horizonte:
          type: integer
          nullable: true
          description: com quantos dias de antecedência o dia foi previsto (1 = na véspera; até 14)
        loja_fechada:
          type: boolean
          nullable: true
          description: se a previsão contava com a loja fechada no dia (o calendário da época)

    HistoricoPrevisao:
      type: object
      required: [serie, avaliacao]
      properties:
        serie:
          type: array
          items:
            $ref: "#/components/schemas/DiaHistoricoPrevisao"
        avaliacao:
          allOf:
            - $ref: "#/components/schemas/AvaliacaoHistorico"
          nullable: true

    AvaliacaoHistorico:
      type: object
      description: |
        Métricas do walk-forward da série (56 origens andando 1 dia, 14 dias cada), nos dias de
        loja aberta, no último treino concluído que a avaliou.
      required: [status, treinado_em, dados_ate, dias_avaliados, mae, wape_pct, mase, largura_ic95, venda_media_dia]
      properties:
        status:
          type: string
          enum: [trained]
        treinado_em: {type: string, format: date-time, description: fim do treino}
        dados_ate: {type: string, format: date, nullable: true, description: último dia com venda do treino}
        dias_avaliados: {type: integer, description: dias de loja aberta previstos no teste}
        mae: {type: number, description: "erro médio absoluto por dia (MAE), em unidades"}
        wape_pct:
          type: number
          nullable: true
          description: "erro absoluto somado ÷ venda somada × 100 (WAPE); nulo sem venda"
        mase: {type: number, description: "MAE ÷ erro médio da naïve sazonal (repetir a semana anterior) no treino; < 1 = melhor que ela"}
        largura_ic95: {type: number, description: "distância média entre os limites da faixa de 95%, em unidades"}
        venda_media_dia: {type: number, description: venda média nos dias avaliados, em unidades}

    ValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  type: string
              msg:
                type: string
              type:
                type: string

  # ─────────────────────────────────────────────
  # Reusable Responses
  # ─────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Não autenticado ou token expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            detail: "Autenticação necessária. Faça login para continuar."

# ─────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────
paths:

  # ── Health ──────────────────────────────────
  /health:
    get:
      tags: [health]
      summary: Status do sistema
      description: Verifica se a API, banco e scheduler estão operacionais. Endpoint público.
      operationId: getHealth
      responses:
        "200":
          description: Sistema operacional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ── Auth ─────────────────────────────────────
  /auth/login:
    post:
      tags: [auth]
      summary: Login com e-mail e senha
      description: Retorna access_token (8h) e refresh_token (7d). Endpoint público.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              example:
                detail: "E-mail ou senha incorretos."
        "422":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "429":
          description: >
            Senha errada 5 vezes para o mesmo e-mail do mesmo IP, ou 20 vezes de qualquer IP,
            nos últimos 15 minutos. Nem a senha certa entra até a janela passar.
          headers:
            Retry-After:
              description: Segundos até poder tentar de novo
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              example:
                detail: "Muitas tentativas com senha errada. Tente de novo em 15 minutos."

  /auth/refresh:
    post:
      tags: [auth]
      summary: Renovar access_token
      description: Gera novo access_token usando um refresh_token válido.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Novo access_token gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
        "401":
          description: Refresh token inválido, expirado ou encerrado no logout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  /auth/logout:
    post:
      tags: [auth]
      summary: Encerrar a sessão
      description: >
        Revoga o refresh_token: `/auth/refresh` passa a recusá-lo. Público (o access_token pode
        já ter expirado). Token inválido ou expirado também responde 204, sem nada a revogar.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Sessão encerrada

  /auth/me:
    get:
      tags: [auth]
      summary: Dados do usuário autenticado
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Dados do usuário atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOut"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  # ── Upload ───────────────────────────────────
  # ── Painel (telas do frontend) ───────────────
  /api/v1/contexto:
    get:
      tags: [painel]
      summary: Contexto do layout (lojas, categorias, última venda, status dos previsores)
      description: Lido logo após o login. Leve — consultas agregadas, sem ler a base inteira.
      operationId: getContexto
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Contexto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contexto"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/painel:
    get:
      tags: [painel]
      summary: Painel de previsão (dados das telas Visão Geral, Previsão e Relatórios)
      description: |
        Previsão (até 91 dias, ADR-021) do último treino concluído (4 categorias e produtos de grama de
        cada loja; o total da loja é a soma das categorias), histórico, encomendas grandes e teste de
        acerto de cada categoria, no formato `BaseReal` do frontend. Fica em cache na API até
        as vendas, o calendário ou a previsão mudarem.
      operationId: getPainel
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Painel montado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Painel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Ainda não há previsão gravada (nenhum treino concluído)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              example:
                detail: "A previsão ainda não foi gerada. Peça à gestora para usar \"Treinar previsões\" e tente de novo."

  /api/v1/painel/historico/{unidade}/{nivel}/{item}:
    get:
      tags: [painel]
      summary: Histórico da previsão de uma categoria ou produto (vendido × previsto gravado)
      description: |
        Um ponto por dia, do começo da base até o último dia com venda do último treino
        concluído do serviço de previsão (`/api/v1/servico-previsao/treinos`): o vendido sem
        encomendas grandes (de `sales`) e o previsto gravado em `forecast_history`. O previsto
        de cada dia é o registro mais antigo dele, que não é trocado: cada treino grava os 14
        primeiros dias da sua previsão e, do walk-forward, a janela mais antiga que previu cada
        dia (até 14 dias antes, `fonte = walk_forward`), só nos dias que ainda não tinham
        registro. Com treinos semanais, cada dia fica com a previsão do treino que o previu
        primeiro; antes do 1º treino, ou quando o treino seguinte demorou mais de 14 dias, os
        dias vêm do walk-forward. `horizonte`: com quantos dias de antecedência o dia foi
        previsto. `previsto`, `inf`, `sup`, `fonte` e `horizonte` são nulos antes do 1º treino.

        `avaliacao`: as métricas do walk-forward da série (dias de loja aberta) no último treino
        concluído que a avaliou — se o último treino a recusou (`insufficient_data`, `error`),
        vale o anterior; nula se nenhum treino a avaliou.
      operationId: getHistoricoPrevisao
      security:
        - BearerAuth: []
      parameters:
        - {name: unidade, in: path, required: true, schema: {type: string}, example: jardim-canada}
        - {name: nivel, in: path, required: true, schema: {type: string, enum: [categoria, produto]}}
        - {name: item, in: path, required: true, schema: {type: string}, example: grama,
           description: id da categoria ou código do produto}
      responses:
        "200":
          description: Série diária e avaliação do último treino
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricoPrevisao"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Item sem venda na loja
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "409":
          description: Nenhum treino do serviço de previsão concluído
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  /api/v1/atividades:
    get:
      tags: [painel]
      summary: Log de uso do sistema — planilhas enviadas e treinos da previsão, do mais recente ao mais antigo
      description: A reclassificação da base (scripts de manutenção) fica de fora. `mensagem` só vem quando deu erro.
      operationId: getAtividades
      security:
        - BearerAuth: []
      parameters:
        - {name: limite, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: Eventos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Atividade"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Limite fora de 1 a 500
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /api/v1/analises:
    get:
      tags: [painel]
      summary: Análises descritivas da base de vendas, por loja
      operationId: getAnalises
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Análises por loja
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analises"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/registros:
    get:
      tags: [painel]
      summary: Índice da base linha a linha (meses disponíveis)
      operationId: getIndiceRegistros
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Meses com venda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndiceRegistros"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/registros/linhas:
    get:
      tags: [painel]
      summary: Uma página da base linha a linha (filtro, busca e ordem feitos no banco)
      operationId: getLinhasRegistros
      security:
        - BearerAuth: []
      parameters:
        - {name: meses, in: query, schema: {type: array, items: {type: string, pattern: '^\d{4}-\d{2}$'}}, style: form, explode: true, description: "AAAA-MM; vazio = todos"}
        - {name: lojas, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: categorias, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: pagamentos, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: cliente, in: query, schema: {type: string, enum: [todos, consumidor, cadastrado], default: todos}}
        - {name: tipo, in: query, schema: {type: string, enum: [todos, dia, encomenda], default: todos}}
        - {name: desconto, in: query, schema: {type: string, enum: [todos, com, sem], default: todos}, description: linhas com ou sem desconto}
        - {name: movimento, in: query, schema: {type: string, enum: [todos, venda, devolucao], default: todos}, description: "devolução = quantidade ou valor líquido negativo"}
        - {name: data_de, in: query, schema: {type: string, format: date}}
        - {name: data_ate, in: query, schema: {type: string, format: date}}
        - {name: valor_min, in: query, schema: {type: number}}
        - {name: valor_max, in: query, schema: {type: number}}
        - {name: busca, in: query, schema: {type: string, maxLength: 100}, description: produto, código ou nº da nota}
        - {name: ordem, in: query, schema: {type: string, enum: [data, loja, nota, produto, categoria, qtd, unit, desc, liq, pag, cliente, tipo], default: data}}
        - {name: direcao, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: pagina, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: tamanho, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Página
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaRegistros"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: "Filtro inválido (ex.: mês fora do formato AAAA-MM, tamanho acima de 200)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /api/v1/registros/resumo:
    get:
      tags: [painel]
      summary: Totais do filtro
      operationId: getResumoRegistros
      security:
        - BearerAuth: []
      parameters:
        - {name: meses, in: query, schema: {type: array, items: {type: string, pattern: '^\d{4}-\d{2}$'}}, style: form, explode: true, description: "AAAA-MM; vazio = todos"}
        - {name: lojas, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: categorias, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: pagamentos, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: cliente, in: query, schema: {type: string, enum: [todos, consumidor, cadastrado], default: todos}}
        - {name: tipo, in: query, schema: {type: string, enum: [todos, dia, encomenda], default: todos}}
        - {name: desconto, in: query, schema: {type: string, enum: [todos, com, sem], default: todos}, description: linhas com ou sem desconto}
        - {name: movimento, in: query, schema: {type: string, enum: [todos, venda, devolucao], default: todos}, description: "devolução = quantidade ou valor líquido negativo"}
        - {name: data_de, in: query, schema: {type: string, format: date}}
        - {name: data_ate, in: query, schema: {type: string, format: date}}
        - {name: valor_min, in: query, schema: {type: number}}
        - {name: valor_max, in: query, schema: {type: number}}
        - {name: busca, in: query, schema: {type: string, maxLength: 100}, description: produto, código ou nº da nota}
      responses:
        "200":
          description: Totais
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumoRegistros"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/registros/nota:
    get:
      tags: [painel]
      summary: Itens de uma nota (painel lateral)
      operationId: getItensDaNota
      security:
        - BearerAuth: []
      parameters:
        - {name: loja, in: query, required: true, schema: {type: string}}
        - {name: data, in: query, required: true, schema: {type: string, format: date}}
        - {name: nota, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Itens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Registro"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/registros/exportar:
    get:
      tags: [painel]
      summary: Todas as linhas do filtro, para o arquivo Excel/CSV (só quando a pessoa exporta)
      description: Enviado em pedaços (chunked), sem tamanho fixo — a base inteira passa de 40 MB.
      operationId: getExportarRegistros
      security:
        - BearerAuth: []
      parameters:
        - {name: meses, in: query, schema: {type: array, items: {type: string, pattern: '^\d{4}-\d{2}$'}}, style: form, explode: true, description: "AAAA-MM; vazio = todos"}
        - {name: lojas, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: categorias, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: pagamentos, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: cliente, in: query, schema: {type: string, enum: [todos, consumidor, cadastrado], default: todos}}
        - {name: tipo, in: query, schema: {type: string, enum: [todos, dia, encomenda], default: todos}}
        - {name: desconto, in: query, schema: {type: string, enum: [todos, com, sem], default: todos}, description: linhas com ou sem desconto}
        - {name: movimento, in: query, schema: {type: string, enum: [todos, venda, devolucao], default: todos}, description: "devolução = quantidade ou valor líquido negativo"}
        - {name: data_de, in: query, schema: {type: string, format: date}}
        - {name: data_ate, in: query, schema: {type: string, format: date}}
        - {name: valor_min, in: query, schema: {type: number}}
        - {name: valor_max, in: query, schema: {type: number}}
        - {name: busca, in: query, schema: {type: string, maxLength: 100}, description: produto, código ou nº da nota}
        - {name: ordem, in: query, schema: {type: string, enum: [data, loja, nota, produto, categoria, qtd, unit, desc, liq, pag, cliente, tipo], default: data}}
        - {name: direcao, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
      responses:
        "200":
          description: Linhas em listas, na ordem de `colunas`
          content:
            application/json:
              schema:
                type: object
                properties:
                  colunas:
                    type: array
                    items: {type: string}
                  linhas:
                    type: array
                    items:
                      type: array
                      items: {}
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/upload:
    post:
      tags: [upload]
      summary: Enviar planilha XLSX de vendas
      description: |
        Processa o relatório "Contas a Receber" (XLSX) com as Etapas 1–3 do
        pré-processamento (leitura, limpeza, loja e categoria) e grava em `sales` só as
        vendas novas. Deduplica contra o que já está no banco pela chave
        (doc_numero, produto_cod, emissao, qtdade, vl_total); linhas iguais dentro do
        mesmo arquivo são vendas reais e são mantidas (01-pre_processing.md §2). O mesmo
        arquivo (mesmo SHA-256) não é carregado duas vezes. A planilha não é guardada: fica
        a linha de `processing_log`, com o período e os avisos em `quality`. Com venda nova,
        `needs_training` avisa que a previsão precisa ser treinada de novo (o treino não roda
        sozinho: várias planilhas seguidas e um treino só no fim). A tela confere a planilha antes (`POST /api/v1/upload/verificacao`) e só chama esta
        rota quando a gestora confirma. **Requer perfil admin.**
      operationId: uploadFile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo .xlsx ou .xlsm (máximo 50 MB)
      responses:
        "200":
          description: Arquivo processado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Formato de arquivo inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              example:
                detail: "Apenas arquivos .xlsx e .xlsm são aceitos."
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "403":
          description: Perfil insuficiente (requer admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              example:
                detail: "Você não tem permissão para esta ação."
        "409":
          description: A mesma planilha já foi carregada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              example:
                detail: "Esta planilha já foi carregada antes. Nada foi duplicado."
        "413":
          description: Arquivo maior que 50 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  /api/v1/upload/verificacao:
    post:
      tags: [upload]
      summary: Conferir a planilha antes de gravar
      description: |
        Passa a planilha pelas mesmas etapas de `POST /api/v1/upload` e devolve o que a carga
        faria — período de cada loja, vendas novas, já carregadas e ignoradas — e os dias de
        loja aberta que ficariam sem venda na base (`missing_days`), **sem gravar nada** (nem
        em `processing_log`). A tela mostra o aviso e, se a gestora confirmar, envia o mesmo
        arquivo para `POST /api/v1/upload`, que confere de novo e grava os avisos em
        `processing_log.quality`. Recusa o arquivo como o upload (400, 409, 413).
        **Requer perfil admin.**
      operationId: checkUploadFile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo .xlsx ou .xlsm (máximo 50 MB)
      responses:
        "200":
          description: Planilha conferida (nada foi gravado)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadCheckResponse"
        "400":
          description: Formato de arquivo inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "403":
          description: Perfil insuficiente (requer admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "409":
          description: A mesma planilha já foi carregada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "413":
          description: Arquivo maior que 50 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  # ── Serviço de previsão (só admin) ─────────────
  /api/v1/servico-previsao/status:
    get:
      tags: [servico-previsao]
      summary: Andamento do serviço de previsão
      description: |
        Treino em andamento (com o progresso), o último disparo e se os dados mudaram desde o
        último treino concluído. A aba de notificações consulta isto. **Requer perfil admin.**
      operationId: getForecastServiceStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StatusServico"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Perfil insuficiente (requer admin)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}

  /api/v1/servico-previsao/treinos:
    post:
      tags: [servico-previsao]
      summary: Disparar o treino das categorias e dos produtos de grama
      description: |
        Treina, em segundo plano, as 4 categorias e cada produto de grama de cada loja:
        SARIMAX m=7, D=0, com d = 0 (com constante) e d = 1 (sem) avaliados no walk-forward de cada
        série — fica o que errou menos (ADR-020) —, exógenas de calendário, ordem por AIC para cada d; walk-forward com janela deslizante, origem andando
        1 dia e horizonte de 14 dias; previsão dos 91 dias seguintes à última venda (ADR-021). Grava andamento, log e resultados no banco e, ao concluir, o
        histórico congelado (`forecast_history`), as planilhas que entraram no treino
        (`processing_log.forecast_job_id`) e apaga o walk-forward dos treinos mais antigos que
        os últimos `FORECAST_SERVICE_KEEP_BACKTEST_JOBS`. Com `TRAINING_RUNNER=externo` a API
        responde 503 e o treino roda pelo script `python -m backend.scripts.treinar_previsoes`.

        Só treina se os dados (vendas, calendário, catálogo) mudaram desde o último treino
        concluído; senão registra o disparo como `skipped` e responde 200 sem treinar.
        **Requer perfil admin.**
      operationId: triggerForecastService
      responses:
        "202":
          description: Treino iniciado em segundo plano
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DisparoResposta"}
        "200":
          description: Dados sem alteração — disparo registrado como `skipped`, nada treinado
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DisparoResposta"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Perfil insuficiente (requer admin)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}
        "409":
          description: Já existe treino em andamento (deste serviço ou dos modelos da loja)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}
              example:
                detail: "Já existe um treino em andamento. Acompanhe o progresso nas notificações."
        "503":
          description: Esta API não treina (`TRAINING_RUNNER=externo`)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}

  /api/v1/servico-previsao/treinos/{treino_id}:
    get:
      tags: [servico-previsao]
      summary: Um disparo do serviço de previsão
      description: "**Requer perfil admin.**"
      operationId: getForecastServiceJob
      parameters:
        - {name: treino_id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Disparo
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TreinoServico"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Perfil insuficiente (requer admin)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}
        "404":
          description: Treino não encontrado
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}

  /api/v1/servico-previsao/treinos/{treino_id}/logs:
    get:
      tags: [servico-previsao]
      summary: Log do treino
      description: Linhas do log em ordem, com leitura incremental por `apos_id`. **Requer perfil admin.**
      operationId: getForecastServiceJobLogs
      parameters:
        - {name: treino_id, in: path, required: true, schema: {type: integer}}
        - {name: apos_id, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limite, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 2000, default: 500}}
      responses:
        "200":
          description: Linhas do log
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LogTreino"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Perfil insuficiente (requer admin)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}
        "404":
          description: Treino não encontrado
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}

  /api/v1/servico-previsao/treinos/{treino_id}/series:
    get:
      tags: [servico-previsao]
      summary: Resultado de cada série do treino
      description: |
        Ordem, AIC, métricas do walk-forward e previsão dos próximos 91 dias de cada série
        (categoria ou produto de grama, por loja). Série sem dados suficientes vem com
        `status = insufficient_data`, o motivo em `mensagem` e sem previsão. **Requer perfil admin.**
      operationId: getForecastServiceJobSeries
      parameters:
        - {name: treino_id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Séries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SerieTreinada"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Perfil insuficiente (requer admin)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}
        "404":
          description: Treino não encontrado
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}

security:
  - BearerAuth: []
