openapi: 3.0.3

info:
  title: Floricultura — API de Previsão de Vendas
  description: |
    Sistema de previsão de demanda diária para rede de floricultura com 2 unidades
    operacionais (Jardim Canadá e Itabirito), horizonte de 14 dias, com intervalo de
    confiança de 95%. Modelagem hierárquica: SARIMAX na venda diária total de cada
    `unidade` (L1, 2 séries) e desagregação em
    cascata `unidade → categoria → SKU` (L2). A recomendação de reposição (L3) saiu de
    escopo: o sistema informa quanto deve vender e a loja decide a compra (ADR-011).
    Ver docs/prediction/ADR-009-granularidade-diaria-e-reposicao.md e
    docs/prediction/ADR-011-escopo-previsao-sem-reposicao.md.

    ## Autenticação
    Todos os endpoints `/api/v1/*` exigem JWT via header `Authorization: Bearer <token>`.
    Obtenha o token em `POST /auth/login`.

    ## Perfis
    - **admin**: upload, retrain, acesso completo
    - **viewer**: somente visualização (painel, análises, registros, status dos modelos)

    ## Telas do frontend
    Cada tela pede só o que usa, quando é aberta. Logo após o login o front lê só
    `GET /api/v1/contexto` (leve); a Visão Geral lê `/api/v1/analises`, Previsão e
    Relatórios leem `/api/v1/painel` (o teste de acerto de cada produto vem à parte, ao abrir
    o produto) e Conferir Dados consulta a base **paginada** em `/api/v1/registros/*`. Os
    endpoints de products, forecast, alerts, simulation e reports estão no contrato mas
    **ainda não implementados** (marcados com `x-implementado: false`).
  version: "3.5.0"
  contact:
    name: Daniel Nunes da Silva & Felipe Gurgel Araújo
    email: felipegurgel5@gmail.com

servers:
  - url: http://localhost:8000
    description: Desenvolvimento local

tags:
  - name: health
    description: Status do sistema
  - name: auth
    description: Autenticação e autorização
  - name: painel
    description: Dados das telas do frontend (previsão, histórico, análises, base linha a linha)
  - name: upload
    description: Envio das planilhas de vendas
  - name: products
    description: Catálogo de produtos e histórico de vendas
  - name: forecast
    description: Previsão de demanda diária por produto (horizonte 14 dias)
  - name: alerts
    description: Alertas automáticos de alta e de queda de demanda
  - name: simulation
    description: Simulação de promoções e vendas casadas
  - name: reports
    description: Exportação de relatórios PDF e Excel
  - name: models
    description: Status e controle dos modelos preditivos

# ─────────────────────────────────────────────
# Security Schemes
# ─────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtido via POST /auth/login

  # ─────────────────────────────────────────────
  # Schemas
  # ─────────────────────────────────────────────
  schemas:

    # --- Auth ---
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: gestora@floricultura.com
        password:
          type: string
          format: password
          example: "senha_segura_123"

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: bearer
        role:
          type: string
          enum: [admin, viewer]
          example: admin
        expires_in:
          type: integer
          description: Segundos até expiração do access_token
          example: 28800

    UserOut:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: gestora@floricultura.com
        name:
          type: string
          example: Ana Gestora
        role:
          type: string
          enum: [admin, viewer]
          example: admin

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    # --- Health ---
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: "1.0.0"
        database:
          type: string
          example: connected
        scheduler:
          type: string
          example: running

    # --- Upload ---
    UploadResponse:
      type: object
      properties:
        filename:
          type: string
          example: contas_jan2026.xlsx
        rows_added:
          type: integer
          example: 3821
        rows_skipped:
          type: integer
          example: 12
        rows_duplicate:
          type: integer
          example: 44
        processing_time_seconds:
          type: number
          format: float
          example: 8.3
        retrain_scheduled:
          type: boolean
          description: A planilha trouxe venda nova e a previsão vai ser atualizada
          example: true
        retrain_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Quando o treino começa (`RETRAIN_AFTER_UPLOAD_MINUTES` após o upload; outra
            planilha nesse intervalo adia). Nulo se não houver venda nova ou se o agendador
            não estiver rodando — aí fica para o treino semanal.
        errors:
          type: array
          items:
            type: string

    # --- Products ---
    ProductSummary:
      type: object
      properties:
        produto_cod:
          type: string
          example: "147"
        produto_nome:
          type: string
          example: ROSA VERMELHA 40CM
        categoria:
          type: string
          example: "Flores de corte"
        unidade:
          type: string
          example: "Jardim Canadá"
        total_sold:
          type: number
          format: float
          example: 128450.0
        model_status:
          type: string
          description: Status do modelo L1 da unidade do produto (a previsão do SKU vem da desagregação desse modelo)
          enum: [trained, low_confidence, insufficient_data, error, pending, training]
          example: trained
        last_mase:
          type: number
          format: float
          nullable: true
          example: 0.82
        last_trained_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-21T02:00:00"

    ProductListResponse:
      type: object
      properties:
        total:
          type: integer
          example: 5134
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummary"

    DailyPoint:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2026-03-07"
        quantity:
          type: number
          format: float
          example: 42.0

    ModelMetrics:
      description: Métricas do modelo L1 da unidade à qual o produto pertence, medidas no walk-forward (origem móvel, h = 14 dias).
      type: object
      properties:
        MASE:
          type: number
          format: float
          description: Métrica primária — < 1.0 significa que bate a previsão ingênua sazonal semanal
          example: 0.82
        RMSSE:
          type: number
          format: float
          example: 0.79
        IC_coverage_pct:
          type: number
          format: float
          description: Cobertura empírica do intervalo de 95% (esperado entre 90 e 98)
          example: 94.1
        MAE:
          type: number
          format: float
          example: 6.4
        RMSE:
          type: number
          format: float
          example: 9.1
        MAPE_pct:
          type: number
          format: float
          description: Informativo — instável com contagem baixa; não classifica o modelo
          nullable: true
          example: 18.3
        accuracy_label:
          type: string
          description: Rótulo em PT-BR sem jargão técnico
          example: "Precisão estimada: 92%"

    ProductDetailResponse:
      type: object
      properties:
        produto_cod:
          type: string
          example: "147"
        produto_nome:
          type: string
          example: ROSA VERMELHA 40CM
        categoria:
          type: string
          example: "Flores de corte"
        unidade:
          type: string
          example: "Jardim Canadá"
        total_sold:
          type: number
          format: float
          example: 128450.0
        daily_history:
          type: array
          description: Histórico diário de vendas do SKU
          items:
            $ref: "#/components/schemas/DailyPoint"
        model_status:
          type: string
          description: Status do modelo L1 da unidade do produto
          enum: [trained, low_confidence, insufficient_data, error, pending, training]
        metrics:
          $ref: "#/components/schemas/ModelMetrics"
          nullable: true
        sarimax_order:
          type: string
          description: Ordem (p,d,q) do modelo L1 da unidade
          nullable: true
          example: "(0,1,1)"
        seasonal_order:
          type: string
          description: Ordem sazonal semanal (P,D,Q,m) do modelo L1 da unidade
          nullable: true
          example: "(0,0,1,7)"
        use_log_transform:
          type: boolean
          nullable: true
          example: true
        last_trained_at:
          type: string
          format: date-time
          nullable: true

    # --- Forecast (diário) ---
    ForecastPoint:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2026-03-07"
        predicted:
          type: number
          format: float
          example: 48.0
        lower_95:
          type: number
          format: float
          example: 31.0
        upper_95:
          type: number
          format: float
          example: 65.0
        weekday:
          type: string
          description: Dia da semana (PT-BR)
          example: "sábado"
        is_weekend:
          type: boolean
          example: true
        is_holiday:
          type: boolean
          example: false
        commemorative_label:
          type: string
          nullable: true
          description: Data comemorativa próxima, se houver
          example: "3 dias para o Dia das Mães"

    ForecastResponse:
      type: object
      properties:
        produto_cod:
          type: string
          example: "147"
        produto_nome:
          type: string
          example: ROSA VERMELHA 40CM
        categoria:
          type: string
          example: "Flores de corte"
        unidade:
          type: string
          example: "Jardim Canadá"
        horizon_days:
          type: integer
          example: 14
        forecast:
          type: array
          items:
            $ref: "#/components/schemas/ForecastPoint"
        generated_at:
          type: string
          format: date-time
          example: "2026-03-06T03:00:00"
        model_trained_at:
          type: string
          format: date-time
          example: "2026-03-02T02:00:00"

    ForecastBatchItem:
      type: object
      properties:
        produto_cod:
          type: string
          example: "147"
        produto_nome:
          type: string
          example: ROSA VERMELHA 40CM
        next_7d_predicted:
          type: number
          format: float
          description: Soma da demanda prevista para os próximos 7 dias
          example: 260.0
        next_7d_lower_95:
          type: number
          format: float
          example: 205.0
        next_7d_upper_95:
          type: number
          format: float
          example: 315.0
        window_start:
          type: string
          format: date
          example: "2026-03-07"

    ForecastBatchResponse:
      type: object
      properties:
        horizon_days:
          type: integer
          example: 14
        generated_at:
          type: string
          format: date-time
        forecasts:
          type: array
          items:
            $ref: "#/components/schemas/ForecastBatchItem"

    # --- Alerts ---
    AlertItem:
      type: object
      properties:
        produto_cod:
          type: string
          example: "147"
        produto_nome:
          type: string
          example: ROSA VERMELHA 40CM
        kind:
          type: string
          enum: [pico_demanda, risco_sobra]
          description: pico_demanda = previsão dos próximos 7 dias ≥ 20% acima da média das últimas 4 semanas; risco_sobra = previsão dos próximos 7 dias ≥ 20% abaixo dessa média (comprar o mesmo que antes tende a sobrar)
          example: pico_demanda
        severity:
          type: string
          enum: [high, medium]
          example: high
        reason:
          type: string
          description: Justificativa em PT-BR sem jargão técnico
          example: "Previsão dos próximos 7 dias (260 un) é 38% acima da média das últimas 4 semanas (188 un). Pico esperado no sábado (Dia das Mães)."
        predicted_next_7d:
          type: number
          format: float
          example: 260.0
        recent_avg_4w:
          type: number
          format: float
          example: 188.0
        variation_pct:
          type: number
          format: float
          example: 38.2
        peak_date:
          type: string
          format: date
          nullable: true
          example: "2026-05-09"
        alert_window_start:
          type: string
          format: date
          example: "2026-03-07"

    AlertListResponse:
      type: object
      properties:
        generated_at:
          type: string
          format: date-time
        total_alerts:
          type: integer
          example: 7
        items:
          type: array
          items:
            $ref: "#/components/schemas/AlertItem"

    # --- Simulation ---
    SimulationScenario:
      type: object
      required: [label, apply_dates]
      properties:
        label:
          type: string
          example: "Promoção 15%"
        discount_pct:
          type: number
          format: float
          nullable: true
          example: 15.0
        bundle_product_cod:
          type: string
          nullable: true
          example: "150"
        expected_uplift_pct:
          type: number
          format: float
          nullable: true
          example: 10.0
        apply_dates:
          type: array
          description: Dias em que o cenário se aplica
          items:
            type: string
            format: date
          example: ["2026-05-07", "2026-05-08", "2026-05-09"]

    SimulationRequest:
      type: object
      required: [produto_cod, scenarios]
      properties:
        produto_cod:
          type: string
          example: "147"
        horizon_days:
          type: integer
          default: 14
          example: 14
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/SimulationScenario"

    SimulationForecastPoint:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2026-08-01"
        predicted:
          type: number
          format: float
          example: 5680.0
        delta:
          type: number
          format: float
          example: 830.0
        delta_pct:
          type: number
          format: float
          example: 17.1

    SimulationScenarioResult:
      type: object
      properties:
        label:
          type: string
          example: "Promoção 15%"
        forecast:
          type: array
          items:
            $ref: "#/components/schemas/SimulationForecastPoint"

    SimulationResponse:
      type: object
      properties:
        produto_cod:
          type: string
          example: "147"
        base_forecast:
          type: array
          items:
            $ref: "#/components/schemas/ForecastPoint"
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/SimulationScenarioResult"

    # --- Model Status ---
    UnitModelStatus:
      description: Status do modelo L1 de uma unidade (venda diária de balcão).
      type: object
      properties:
        unidade:
          type: string
          example: "Jardim Canadá"
        status:
          type: string
          enum: [trained, low_confidence, insufficient_data, error, pending, training]
          example: trained
        sarimax_order:
          type: string
          nullable: true
          example: "(0,1,1)"
        seasonal_order:
          type: string
          nullable: true
          example: "(0,0,1,7)"
        metrics:
          $ref: "#/components/schemas/ModelMetrics"
          nullable: true
        trained_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-03-02T02:00:00"

    ModelStatusResponse:
      description: Status dos modelos L1, um por unidade (2 modelos).
      type: object
      properties:
        last_retrain_at:
          type: string
          format: date-time
          nullable: true
        next_retrain_at:
          type: string
          format: date-time
          nullable: true
        last_forecast_generation_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Última geração da previsão (ao fim de um treino ou após mudança no calendário).
            A previsão não é recalculada todo dia: cada geração grava 60 dias e a API
            entrega os 14 a partir de hoje.
        forecast_until:
          type: string
          format: date
          nullable: true
          description: >-
            Último dia com previsão gravada. Se hoje + 14 dias passa desta data, a base
            está desatualizada e é preciso carregar planilhas novas.
          example: "2026-04-29"
        skus_covered:
          type: integer
          description: SKUs com previsão na última geração
          example: 20
        total_models:
          type: integer
          example: 2
        trained_models:
          type: integer
          example: 2
        low_confidence_models:
          type: integer
          example: 0
        failed_models:
          type: integer
          example: 0
        insufficient_data_models:
          type: integer
          example: 0
        units:
          type: array
          items:
            $ref: "#/components/schemas/UnitModelStatus"
        is_training:
          type: boolean
          example: false
        training_progress_pct:
          type: number
          format: float
          nullable: true
          example: null
        last_retrain_summary:
          type: string
          nullable: true
          example: "2 modelos atualizados, 0 com erro"

    RetrainResponse:
      type: object
      properties:
        message:
          type: string
          example: "Atualização dos modelos iniciada em segundo plano."
        started_at:
          type: string
          format: date-time

    # --- Painel (telas do frontend) ---
    Painel:
      description: |
        Formato `BaseReal` de `app-react/src/domain/types.ts` (fonte do detalhe de cada
        campo): previsão de 14 dias por loja e categoria com faixa de 95%, histórico diário
        (8 semanas) e semanal, produtos regulares com previsão própria, encomendas, testes
        de acerto (walk-forward) e planilhas carregadas. Montado de `sales` até o fim do
        último treino concluído e das tabelas do treino. Sem dados pessoais de clientes.
      type: object
      required: [gerado_em, base, configuracao, categorias, unidades, importacao]
      properties:
        gerado_em:
          type: string
          format: date-time
        fonte:
          type: string
        base:
          type: object
          properties:
            inicio: {type: string, format: date}
            fim: {type: string, format: date}
            linhas: {type: integer}
            skus: {type: integer}
            skus_por_categoria:
              type: object
              additionalProperties: {type: integer}
        configuracao:
          type: object
          description: Configuração do treino (horizonte, m, limiar de encomenda, critério de produto regular...)
          additionalProperties: true
        categorias:
          type: array
          items:
            type: object
            properties:
              id: {type: string, example: grama}
              nome: {type: string}
              grupo: {type: string}
              descricao: {type: string}
        unidades:
          type: array
          description: Uma entrada por loja (`UnidadeDados` em types.ts)
          items:
            type: object
            additionalProperties: true
        importacao:
          type: object
          description: Planilhas carregadas (`processing_log`) e resumo da limpeza
          additionalProperties: true

    Analises:
      description: |
        Análises descritivas por loja (`AnalisesJson` em `app-react/src/app/data/analises.ts`):
        resumo, categorias, mês a mês, dia da semana, consumidor × cadastrado, formas de
        pagamento e produtos mais vendidos no último ano.
      type: object
      properties:
        gerado_em: {type: string, format: date-time}
        limiar_encomenda_un: {type: number, example: 2000}
        unidades:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true

    Contexto:
      description: |
        O que o layout precisa logo após o login (`Contexto` em `app-react/src/domain/types.ts`),
        montado só com consultas agregadas — sem ler a base de vendas inteira.
      type: object
      properties:
        lojas:
          type: array
          items:
            type: object
            properties:
              id: {type: string, example: jardim-canada}
              nome: {type: string}
              cidade: {type: string}
        categorias:
          type: array
          items: {type: object, additionalProperties: true}
        configuracao:
          type: object
          properties:
            horizonte_dias: {type: integer, example: 14}
            limiar_encomenda_un: {type: number, example: 2000}
        base:
          type: object
          properties:
            inicio: {type: string, format: date, nullable: true}
            fim: {type: string, format: date, nullable: true, description: Última venda carregada}
            linhas: {type: integer}
            skus: {type: integer}
        previsao:
          type: object
          nullable: true
          description: Última geração concluída; nulo antes do primeiro treino
          properties:
            gerada_em: {type: string, format: date-time}
            dados_ate: {type: string, format: date}
            lojas:
              type: array
              items:
                type: object
                properties:
                  id: {type: string}
                  status: {type: string, enum: [trained, low_confidence, insufficient_data]}
            produtos:
              type: array
              description: Produtos com previsor próprio e o status de cada um
              items:
                type: object
                properties:
                  loja: {type: string}
                  codigo: {type: string}
                  nome: {type: string}
                  status: {type: string, nullable: true}
        importacao:
          type: object
          additionalProperties: true

    IndiceRegistros:
      description: Meses com venda na base, quantas linhas cada um tem por loja, e as opções dos filtros (tela Conferir Dados).
      type: object
      properties:
        lojas:
          type: array
          items: {type: string}
        pagamentos:
          type: array
          description: "Formas de pagamento como a tela mostra (ex.: Pix); é o valor aceito no filtro `pagamentos`"
          items: {type: string}
        limiar_encomenda_un: {type: number}
        total_registros: {type: integer}
        meses:
          type: array
          items:
            type: object
            properties:
              mes: {type: string, example: "2026-02"}
              registros: {type: integer}
              por_loja:
                type: object
                additionalProperties: {type: integer}

    Registro:
      description: Uma linha de produto de uma nota. Sem nome de cliente, vendedor ou operador.
      type: object
      properties:
        id: {type: integer}
        data: {type: string, format: date}
        loja: {type: string}
        nota: {type: string}
        cod: {type: string}
        nome: {type: string}
        cat: {type: string, description: id da categoria}
        qtd: {type: number}
        unit: {type: number}
        desc: {type: number}
        liq: {type: number}
        pag: {type: string}
        cad: {type: boolean, description: cliente cadastrado (× consumidor)}
        enc: {type: boolean, description: encomenda (nota com mais de 2.000 un.)}

    PaginaRegistros:
      type: object
      properties:
        pagina: {type: integer}
        tamanho: {type: integer}
        linhas:
          type: array
          items:
            $ref: "#/components/schemas/Registro"

    ResumoRegistros:
      description: Totais do filtro. `por_visao` conta cada aba com os mesmos filtros; o resto vale para a aba pedida.
      type: object
      properties:
        por_visao:
          type: object
          properties:
            todos: {type: integer}
            encomendas: {type: integer}
            cadastrados: {type: integer}
            descontos: {type: integer}
            devolucoes: {type: integer}
        registros: {type: integer}
        notas: {type: integer}
        quantidade: {type: number}
        desconto: {type: number}
        valor_liquido: {type: number}

    # --- Errors ---
    ErrorDetail:
      type: object
      properties:
        detail:
          type: string
          example: "Você não tem permissão para esta ação."

    ValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  type: string
              msg:
                type: string
              type:
                type: string

  # ─────────────────────────────────────────────
  # Reusable Responses
  # ─────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Não autenticado ou token expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
            detail: "Autenticação necessária. Faça login para continuar."

# ─────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────
paths:

  # ── Health ──────────────────────────────────
  /health:
    get:
      tags: [health]
      summary: Status do sistema
      description: Verifica se a API, banco e scheduler estão operacionais. Endpoint público.
      operationId: getHealth
      responses:
        "200":
          description: Sistema operacional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ── Auth ─────────────────────────────────────
  /auth/login:
    post:
      tags: [auth]
      summary: Login com e-mail e senha
      description: Retorna access_token (8h) e refresh_token (7d). Endpoint público.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              example:
                detail: "E-mail ou senha incorretos."
        "422":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Renovar access_token
      description: Gera novo access_token usando um refresh_token válido.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Novo access_token gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
        "401":
          description: Refresh token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  /auth/me:
    get:
      tags: [auth]
      summary: Dados do usuário autenticado
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Dados do usuário atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOut"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  # ── Upload ───────────────────────────────────
  # ── Painel (telas do frontend) ───────────────
  /api/v1/contexto:
    get:
      tags: [painel]
      summary: Contexto do layout (lojas, categorias, última venda, status dos previsores)
      description: Lido logo após o login. Leve — consultas agregadas, sem ler a base inteira.
      operationId: getContexto
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Contexto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contexto"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/painel:
    get:
      tags: [painel]
      summary: Painel de previsão (dados das telas Visão Geral, Previsão e Relatórios)
      description: |
        Previsão de 14 dias da última geração concluída, histórico, produtos, encomendas e
        testes de acerto, no formato `BaseReal` do frontend — **sem** o teste de acerto de
        cada produto (`/painel/produtos/{unidade}/{codigo}/backtest`, pedido ao abrir o
        produto). Fica em cache na API até as vendas, o calendário ou a previsão mudarem.
      operationId: getPainel
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Painel montado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Painel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Ainda não há previsão gravada (nenhum treino concluído)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              example:
                detail: "A previsão ainda não foi gerada. Peça à gestora para atualizar os modelos e tente de novo."

  /api/v1/painel/produtos/{unidade}/{codigo}/backtest:
    get:
      tags: [painel]
      summary: Teste de acerto de um produto (previsto × vendido em cada dia do walk-forward)
      operationId: getBacktestProduto
      security:
        - BearerAuth: []
      parameters:
        - {name: unidade, in: path, required: true, schema: {type: string}, example: jardim-canada}
        - {name: codigo, in: path, required: true, schema: {type: string}, example: "2163"}
      responses:
        "200":
          description: Pontos do teste
          content:
            application/json:
              schema:
                type: array
                items: {type: object, additionalProperties: true}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Produto sem previsor próprio na loja
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  /api/v1/analises:
    get:
      tags: [painel]
      summary: Análises descritivas da base de vendas, por loja
      operationId: getAnalises
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Análises por loja
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analises"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/registros:
    get:
      tags: [painel]
      summary: Índice da base linha a linha (meses disponíveis)
      operationId: getIndiceRegistros
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Meses com venda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndiceRegistros"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/registros/linhas:
    get:
      tags: [painel]
      summary: Uma página da base linha a linha (filtro, busca, aba e ordem feitos no banco)
      operationId: getLinhasRegistros
      security:
        - BearerAuth: []
      parameters:
        - {name: meses, in: query, schema: {type: array, items: {type: string, pattern: '^\d{4}-\d{2}$'}}, style: form, explode: true, description: "AAAA-MM; vazio = todos"}
        - {name: lojas, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: categorias, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: pagamentos, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: cliente, in: query, schema: {type: string, enum: [todos, consumidor, cadastrado], default: todos}}
        - {name: tipo, in: query, schema: {type: string, enum: [todos, dia, encomenda], default: todos}}
        - {name: data_de, in: query, schema: {type: string, format: date}}
        - {name: data_ate, in: query, schema: {type: string, format: date}}
        - {name: valor_min, in: query, schema: {type: number}}
        - {name: valor_max, in: query, schema: {type: number}}
        - {name: busca, in: query, schema: {type: string, maxLength: 100}, description: produto, código ou nº da nota}
        - {name: visao, in: query, schema: {type: string, enum: [todos, encomendas, cadastrados, descontos, devolucoes], default: todos}}
        - {name: ordem, in: query, schema: {type: string, enum: [data, loja, nota, produto, categoria, qtd, unit, desc, liq, pag, cliente, tipo], default: data}}
        - {name: direcao, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: pagina, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: tamanho, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Página
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaRegistros"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: "Filtro inválido (ex.: mês fora do formato AAAA-MM, tamanho acima de 200)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /api/v1/registros/resumo:
    get:
      tags: [painel]
      summary: Totais do filtro e contagem de cada aba
      operationId: getResumoRegistros
      security:
        - BearerAuth: []
      parameters:
        - {name: meses, in: query, schema: {type: array, items: {type: string, pattern: '^\d{4}-\d{2}$'}}, style: form, explode: true, description: "AAAA-MM; vazio = todos"}
        - {name: lojas, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: categorias, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: pagamentos, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: cliente, in: query, schema: {type: string, enum: [todos, consumidor, cadastrado], default: todos}}
        - {name: tipo, in: query, schema: {type: string, enum: [todos, dia, encomenda], default: todos}}
        - {name: data_de, in: query, schema: {type: string, format: date}}
        - {name: data_ate, in: query, schema: {type: string, format: date}}
        - {name: valor_min, in: query, schema: {type: number}}
        - {name: valor_max, in: query, schema: {type: number}}
        - {name: busca, in: query, schema: {type: string, maxLength: 100}, description: produto, código ou nº da nota}
        - {name: visao, in: query, schema: {type: string, enum: [todos, encomendas, cadastrados, descontos, devolucoes], default: todos}}
      responses:
        "200":
          description: Totais
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumoRegistros"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/registros/nota:
    get:
      tags: [painel]
      summary: Itens de uma nota (painel lateral)
      operationId: getItensDaNota
      security:
        - BearerAuth: []
      parameters:
        - {name: loja, in: query, required: true, schema: {type: string}}
        - {name: data, in: query, required: true, schema: {type: string, format: date}}
        - {name: nota, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Itens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Registro"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/registros/exportar:
    get:
      tags: [painel]
      summary: Todas as linhas do filtro, para o arquivo Excel/CSV (só quando a pessoa exporta)
      description: Enviado em pedaços (chunked), sem tamanho fixo — a base inteira passa de 40 MB.
      operationId: getExportarRegistros
      security:
        - BearerAuth: []
      parameters:
        - {name: meses, in: query, schema: {type: array, items: {type: string, pattern: '^\d{4}-\d{2}$'}}, style: form, explode: true, description: "AAAA-MM; vazio = todos"}
        - {name: lojas, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: categorias, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: pagamentos, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: cliente, in: query, schema: {type: string, enum: [todos, consumidor, cadastrado], default: todos}}
        - {name: tipo, in: query, schema: {type: string, enum: [todos, dia, encomenda], default: todos}}
        - {name: data_de, in: query, schema: {type: string, format: date}}
        - {name: data_ate, in: query, schema: {type: string, format: date}}
        - {name: valor_min, in: query, schema: {type: number}}
        - {name: valor_max, in: query, schema: {type: number}}
        - {name: busca, in: query, schema: {type: string, maxLength: 100}, description: produto, código ou nº da nota}
        - {name: visao, in: query, schema: {type: string, enum: [todos, encomendas, cadastrados, descontos, devolucoes], default: todos}}
        - {name: ordem, in: query, schema: {type: string, enum: [data, loja, nota, produto, categoria, qtd, unit, desc, liq, pag, cliente, tipo], default: data}}
        - {name: direcao, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
      responses:
        "200":
          description: Linhas em listas, na ordem de `colunas`
          content:
            application/json:
              schema:
                type: object
                properties:
                  colunas:
                    type: array
                    items: {type: string}
                  linhas:
                    type: array
                    items:
                      type: array
                      items: {}
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/upload:
    post:
      tags: [upload]
      summary: Enviar planilha XLSX de vendas
      description: |
        Processa o relatório "Contas a Receber" (XLSX) com as Etapas 1–3 do
        pré-processamento (leitura, limpeza, loja e categoria) e grava em `sales` só as
        vendas novas. Deduplica contra o que já está no banco pela chave
        (doc_numero, produto_cod, emissao, qtdade, vl_total); linhas iguais dentro do
        mesmo arquivo são vendas reais e são mantidas (01-pre_processing.md §2). O mesmo
        arquivo (mesmo SHA-256) não é carregado duas vezes. A planilha não é guardada: fica
        a linha de `processing_log`. Com venda nova, o treino é agendado para alguns
        minutos depois (`retrain_at`): enviar várias planilhas seguidas gera um treino só.
        **Requer perfil admin.**
      operationId: uploadFile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo .xlsx ou .xlsm (máximo 50 MB)
      responses:
        "200":
          description: Arquivo processado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          description: Formato de arquivo inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              example:
                detail: "Apenas arquivos .xlsx e .xlsm são aceitos."
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "403":
          description: Perfil insuficiente (requer admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              example:
                detail: "Você não tem permissão para esta ação."
        "409":
          description: A mesma planilha já foi carregada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              example:
                detail: "Esta planilha já foi carregada antes. Nada foi duplicado."
        "413":
          description: Arquivo maior que 50 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  # ── Products ─────────────────────────────────
  /api/v1/products:
    get:
      x-implementado: false
      tags: [products]
      summary: Listar produtos
      description: Lista produtos com status do modelo e métricas de desempenho. Requer perfil viewer ou superior.
      operationId: listProducts
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [total_sold, name, mase]
            default: total_sold
        - name: search
          in: query
          description: Busca em produto_cod e produto_nome
          schema:
            type: string
            example: rosa
        - name: model_status
          in: query
          description: Filtrar por status do modelo
          schema:
            type: string
            enum: [trained, low_confidence, insufficient_data, error, pending]
      responses:
        "200":
          description: Lista de produtos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/products/{produto_cod}:
    get:
      x-implementado: false
      tags: [products]
      summary: Detalhes de um produto
      description: Retorna histórico diário de vendas do SKU, categoria/unidade e métricas do modelo L1 da unidade. Sem dados pessoais de clientes (LGPD).
      operationId: getProduct
      security:
        - BearerAuth: []
      parameters:
        - name: produto_cod
          in: path
          required: true
          schema:
            type: string
          example: "147"
      responses:
        "200":
          description: Detalhes do produto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  # ── Forecast (diário) ────────────────────────
  /api/v1/forecast/{produto_cod}:
    get:
      x-implementado: false
      tags: [forecast]
      summary: Previsão de demanda diária para um produto
      description: |
        Retorna a previsão de demanda **por dia** para os próximos `horizon_days` dias.
        Obtida do modelo L1 da unidade do produto, desagregado em cascata
        (`unidade → categoria → SKU`). Inclui intervalo de confiança de 95% e marcação de
        fim de semana, feriado e proximidade de datas comemorativas.
      operationId: getForecast
      security:
        - BearerAuth: []
      parameters:
        - name: produto_cod
          in: path
          required: true
          schema:
            type: string
          example: "147"
        - name: horizon_days
          in: query
          schema:
            type: integer
            default: 14
            minimum: 1
            maximum: 28
      responses:
        "200":
          description: Previsão gerada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "409":
          description: Modelo da unidade não disponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              example:
                detail: "Esta loja ainda não tem histórico suficiente para previsão. Status: insufficient_data"

  /api/v1/forecast/batch:
    get:
      x-implementado: false
      tags: [forecast]
      summary: Previsão diária resumida para os top N produtos
      description: Retorna a demanda prevista para os próximos 7 dias (somada) dos N produtos de maior volume. Ideal para o dashboard principal.
      operationId: getForecastBatch
      security:
        - BearerAuth: []
      parameters:
        - name: top_n
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
        - name: horizon_days
          in: query
          schema:
            type: integer
            default: 14
            minimum: 1
            maximum: 28
      responses:
        "200":
          description: Previsões dos top produtos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastBatchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Alerts ───────────────────────────────────
  /api/v1/alerts:
    get:
      x-implementado: false
      tags: [alerts]
      summary: Alertas de pico de demanda e risco de sobra
      description: |
        `pico_demanda`: produtos cuja previsão dos próximos 7 dias supera em ≥20% a média
        das últimas 4 semanas. `risco_sobra`: produtos cuja previsão dos próximos 7 dias
        fica ≥20% abaixo dessa média. Ordenados pela variação em valor absoluto,
        decrescente. Justificativas em PT-BR sem jargão.
      operationId: getAlerts
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: severity
          in: query
          schema:
            type: string
            enum: [all, high, medium]
            default: all
      responses:
        "200":
          description: Lista de alertas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Simulation ───────────────────────────────
  /api/v1/simulation:
    post:
      x-implementado: false
      tags: [simulation]
      summary: Simular impacto de promoções ou vendas casadas
      description: |
        Aplica cenários de desconto ou bundle sobre a previsão base do produto.
        Retorna comparativo entre cenário base e cada cenário simulado.
      operationId: runSimulation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationRequest"
      responses:
        "200":
          description: Resultado da simulação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Produto não encontrado ou sem modelo treinado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  # ── Reports ──────────────────────────────────
  /api/v1/reports/export:
    get:
      x-implementado: false
      tags: [reports]
      summary: Exportar relatório de previsões e alertas
      description: |
        Gera arquivo PDF ou Excel com a previsão diária dos top N produtos para os
        próximos `horizon_days` dias e a lista de alertas.
        **Excel**: abas "Previsão diária", "Métricas", "Alertas".
        **PDF**: tabela de previsão + alertas com cabeçalho e rodapé.
      operationId: exportReport
      security:
        - BearerAuth: []
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [excel, pdf]
          example: pdf
        - name: top_n
          in: query
          schema:
            type: integer
            default: 10
        - name: horizon_days
          in: query
          schema:
            type: integer
            default: 14
      responses:
        "200":
          description: Arquivo gerado para download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="previsoes_2026-07-28.pdf"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Models ───────────────────────────────────
  /api/v1/models/status:
    get:
      tags: [models]
      summary: Status dos modelos preditivos
      description: Retorna data do último retrain, próximo agendado, contagem por status e progresso se em execução.
      operationId: getModelsStatus
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Status dos modelos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/models/retrain:
    post:
      tags: [models]
      summary: Disparar reajuste manual dos modelos
      description: |
        Inicia em segundo plano o treino dos modelos (loja, desagregação por categoria e
        produtos regulares, com o walk-forward) sobre as vendas do banco e grava a nova
        previsão — numa thread da API ou, no Cloud Run, no Job de treino
        (`TRAINING_RUNNER`). Leva perto de uma hora; o andamento fica em `retrain_history`.
        **Requer perfil admin.**
        Retorna 409 se já houver reajuste em andamento.
      operationId: triggerRetrain
      security:
        - BearerAuth: []
      responses:
        "202":
          description: Retrain iniciado em background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrainResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Perfil insuficiente (requer admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "409":
          description: Retrain já em andamento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
              example:
                detail: "Atualização já em andamento. Tente novamente em alguns minutos."
        "503":
          description: Não foi possível iniciar o Job de treino no Cloud Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

security:
  - BearerAuth: []
